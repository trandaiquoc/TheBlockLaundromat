<div class="searchable-dropdown" [class.open]="open()" (keydown)="onHostKeydown($event)">
  <button
    type="button"
    #dropdownTrigger
    cdkOverlayOrigin
    #dropdownOrigin="cdkOverlayOrigin"
    class="dropdown-trigger"
    [disabled]="disabled"
    [attr.aria-label]="triggerAriaLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? listId : null"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    <span class="selected-value">
      @if (selected; as current) {
        @if (current.thumbnail) {
          <span
            class="dropdown-thumbnail"
            [class.fallback]="!current.thumbnail.urls.length || current.thumbnail.fallback"
            aria-hidden="true"
          >
            @for (url of current.thumbnail.urls; track url) {
              <img [src]="url" alt="" />
            }
          </span>
        }
        <span class="selected-copy">
          <strong>{{ current.label }}</strong>
          @if (current.secondary) {
            <small>{{ current.secondary }}</small>
          }
        </span>
      } @else {
        <span class="placeholder">{{ emptyLabel || placeholder }}</span>
      }
    </span>
    <span class="caret" aria-hidden="true"><svg lucideChevronDown></svg></span>
  </button>
  @if (open()) {
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="dropdownOrigin"
      [cdkConnectedOverlayOpen]="open()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (detach)="close()"
    >
      <div
        class="dropdown-popover"
        (click)="$event.stopPropagation()"
        (focusout)="closeWhenFocusLeaves($event)"
      >
        @let filtered = filteredOptions();
        <input
          #searchInput
          type="search"
          class="dropdown-search"
          role="combobox"
          [value]="query()"
          [placeholder]="placeholder"
          [attr.aria-label]="placeholder"
          aria-autocomplete="list"
          aria-haspopup="listbox"
          [attr.aria-expanded]="open()"
          [attr.aria-controls]="listId"
          [attr.aria-activedescendant]="activeOptionId()"
          (input)="setQuery($event)"
          (keydown)="onKeydown($event)"
        />
        <div class="dropdown-options" [id]="listId" role="listbox">
          @if (emptyLabel) {
            <button
              type="button"
              role="option"
              [id]="optionId(0)"
              class="dropdown-option"
              [class.selected]="!selectedId"
              [class.active-option]="activeIndex() === 0"
              [attr.aria-selected]="!selectedId"
              tabindex="-1"
              (click)="select('')"
            >
              {{ emptyLabel }}
            </button>
          }
          @for (option of filtered; track option.id) {
            <button
              type="button"
              role="option"
              [id]="optionId(optionIndex($index))"
              class="dropdown-option"
              [class.selected]="option.id === selectedId"
              [class.active-option]="optionIndex($index) === activeIndex()"
              [attr.aria-selected]="option.id === selectedId"
              tabindex="-1"
              (click)="select(option.id)"
            >
              @if (option.thumbnail) {
                <span
                  class="dropdown-thumbnail"
                  [class.fallback]="!option.thumbnail.urls.length || option.thumbnail.fallback"
                  aria-hidden="true"
                >
                  @for (url of option.thumbnail.urls; track url) {
                    <img [src]="url" alt="" />
                  }
                </span>
              }
              <span class="dropdown-option-copy"
                ><strong>{{ option.label }}</strong>
                @if (option.secondary) {
                  <small>{{ option.secondary }}</small>
                }
                @if (option.status) {
                  <small class="option-status">{{ option.status }}</small>
                }
              </span>
            </button>
          }
        </div>
        @if (!filtered.length) {
          <p class="no-results" role="status">{{ noResults }}</p>
        }
      </div>
    </ng-template>
  }
</div>
