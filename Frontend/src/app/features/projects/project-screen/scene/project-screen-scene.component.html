<div
  class="scene-background"
  [attr.data-theme]="theme()"
  [attr.data-mascot-state]="mascotState()"
  [attr.data-animations]="animationsEnabled()"
  aria-hidden="true"
>
  <!-- Scene boxes use stable intrinsic sizes so NgOptimizedImage can swap theme sources. -->
  <img
    class="scene-layer--exterior"
    [ngSrc]="scene().exterior.src"
    width="1832"
    height="860"
    priority
    alt=""
  />
  <div class="scene-layer--exterior-lighting"></div>
  <img
    class="scene-layer--room"
    [ngSrc]="scene().room.src"
    width="1832"
    height="860"
    [style.--room-opening-mask]="'url(/' + scene().roomMask.src + ')'"
    priority
    alt=""
  />
  <div class="scene-layer--wall-sign">
    <img
      class="scene-layer--wall-sign-logo"
      ngSrc="assets/brand/the-block-laundromat-logo.svg"
      width="1774"
      height="887"
      alt=""
    />
  </div>
  <img class="scene-layer--washer" [ngSrc]="scene().washer.src" width="1373" height="1222" alt="" />
  <img class="scene-layer--board" [ngSrc]="scene().board.src" width="1402" height="1122" alt="" />
  @if (animationsEnabled()) {
    <img
      class="scene-layer--washer-mascot"
      [ngSrc]="washerMascotStateAsset().src"
      width="1254"
      height="1254"
      alt=""
    />
  } @else {
    <img
      class="scene-layer--washer-mascot"
      [ngSrc]="scene().washerMascot.src"
      width="1388"
      height="1208"
      alt=""
    />
  }
  <img
    class="scene-layer--map-mascot"
    [ngSrc]="scene().mapMascot.src"
    width="1388"
    height="1222"
    alt=""
  />
  <div class="scene-layer--foreground">
    <img
      class="scene-layer--foreground-image"
      [ngSrc]="scene().foreground.src"
      width="664"
      height="374"
      alt=""
    />
  </div>
</div>
