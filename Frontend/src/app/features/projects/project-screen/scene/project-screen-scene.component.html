<div
  class="scene-background"
  [attr.data-theme]="theme()"
  [attr.data-mascot-state]="mascotState()"
  [attr.data-animations]="animationsEnabled()"
  aria-hidden="true"
>
  <img
    class="scene-background-image"
    [ngSrc]="scene().background.src"
    [width]="scene().background.width"
    [height]="scene().background.height"
    priority
    alt=""
  />
  <img
    class="scene-layer--exterior"
    [ngSrc]="scene().exterior.src"
    [width]="scene().exterior.width"
    [height]="scene().exterior.height"
    priority
    alt=""
  />
  <div class="scene-layer--wall-sign">
    <img
      class="scene-layer--wall-sign-logo"
      ngSrc="assets/brand/the-block-laundromat-logo.svg"
      width="1774"
      height="887"
      alt=""
    />
  </div>
  <img
    class="scene-layer--washer"
    [ngSrc]="scene().washer.src"
    [width]="scene().washer.width"
    [height]="scene().washer.height"
    alt=""
  />
  <img
    class="scene-layer--board"
    [ngSrc]="scene().board.src"
    [width]="scene().board.width"
    [height]="scene().board.height"
    alt=""
  />
  @if (animationsEnabled()) {
    <img
      class="scene-layer--washer-mascot"
      [ngSrc]="washerMascotStateAsset().src"
      width="1254"
      height="1254"
      alt=""
    />
  } @else {
    <img
      class="scene-layer--washer-mascot"
      [ngSrc]="scene().washerMascot.src"
      [width]="scene().washerMascot.width"
      [height]="scene().washerMascot.height"
      alt=""
    />
  }
  <img
    class="scene-layer--map-mascot"
    [ngSrc]="scene().mapMascot.src"
    [width]="scene().mapMascot.width"
    [height]="scene().mapMascot.height"
    alt=""
  />
  <div class="scene-layer--foreground">
    <img
      class="scene-layer--foreground-image"
      [ngSrc]="scene().foreground.src"
      [width]="scene().foreground.width"
      [height]="scene().foreground.height"
      alt=""
    />
  </div>
</div>
