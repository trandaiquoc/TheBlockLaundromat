<div
  class="account-anchor"
  [class.account-anchor--compact]="compact()"
  (focusout)="closeWhenFocusLeaves($event)"
>
  <button
    #accountTrigger
    class="account-card"
    type="button"
    [attr.aria-label]="i18n.t('accountMenu') + ': ' + displayName() + ', ' + accountLine()"
    [attr.aria-haspopup]="compact() || !isDemoAccount() ? 'dialog' : 'menu'"
    [attr.aria-expanded]="popoverOpen()"
    (click)="togglePopover()"
  >
    <img
      class="account-avatar"
      ngSrc="assets/project-screen/account/rakoon-avatar.png"
      width="48"
      height="48"
      alt=""
      aria-hidden="true"
    />
    <span class="account-copy">
      <strong>{{ displayName() }}</strong>
      <span>{{ accountLine() }}</span>
    </span>
    <svg
      class="account-chevron"
      [class.is-open]="popoverOpen()"
      lucideChevronDown
      aria-hidden="true"
    ></svg>
  </button>

  <section
    #accountPopover
    class="account-popover"
    [class.is-open]="popoverOpen()"
    [attr.role]="compact() || !isDemoAccount() ? 'dialog' : 'menu'"
    [attr.aria-label]="i18n.t('accountMenu')"
    [attr.aria-hidden]="popoverOpen() ? null : 'true'"
    [attr.inert]="popoverOpen() ? null : ''"
    [attr.tabindex]="-1"
    (keydown)="keepMenuKeyboardFocus($event)"
  >
    <div class="account-popover-identity" role="group">
      <img
        class="account-avatar account-avatar--menu"
        ngSrc="assets/project-screen/account/rakoon-avatar.png"
        width="48"
        height="48"
        alt=""
        aria-hidden="true"
      />
      <span class="account-copy">
        <strong>{{ displayName() }}</strong>
        <span>{{ accountLine() }}</span>
      </span>
    </div>

    <div class="account-separator" role="separator"></div>

    @if (compact()) {
      <div class="account-language-section">
        <span class="account-popover-section-title">{{ i18n.t('language') }}</span>
        <div class="account-language-controls" role="group" [attr.aria-label]="i18n.t('language')">
          <svg lucideGlobe aria-hidden="true"></svg>
          <button
            type="button"
            data-locale="vi"
            [class.is-selected]="i18n.locale() === 'vi'"
            [attr.aria-pressed]="i18n.locale() === 'vi'"
            (click)="setLocale('vi')"
          >
            {{ i18n.t('languageVietnamese') }}
          </button>
          <button
            type="button"
            data-locale="en"
            [class.is-selected]="i18n.locale() === 'en'"
            [attr.aria-pressed]="i18n.locale() === 'en'"
            (click)="setLocale('en')"
          >
            {{ i18n.t('languageEnglish') }}
          </button>
        </div>
      </div>
      <button
        class="account-menu-action account-settings-action"
        type="button"
        (click)="requestSettings()"
      >
        <svg lucideSettings aria-hidden="true"></svg>
        <span>{{ i18n.t('settingsMenu') }}</span>
      </button>
      @if (isDemoAccount()) {
        <button #logoutAction class="account-menu-action" type="button" (click)="logOut()">
          <svg lucideLogOut aria-hidden="true"></svg>
          <span>{{ i18n.t('logOut') }}</span>
        </button>
      }
    } @else if (isDemoAccount()) {
      <button
        #logoutAction
        class="account-menu-action"
        type="button"
        role="menuitem"
        (click)="logOut()"
      >
        <svg lucideLogOut aria-hidden="true"></svg>
        <span>{{ i18n.t('logOut') }}</span>
      </button>
    } @else {
      <p id="project-screen-guest-account-description" class="guest-account-note">
        {{ i18n.t('localProjectsDescription') }}
      </p>
    }
  </section>
</div>
