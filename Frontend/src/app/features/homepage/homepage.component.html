<div class="homepage-root">
  @if (mode() === 'diorama') {
    @defer (on immediate) {
      <app-diorama-home
        (homepageModeRequested)="setHomepageMode($event)"
        (settingsRequested)="openSettings()"
      />
    } @placeholder {
      <p class="homepage-loading" role="status">{{ i18n.t('homepageLoading') }}</p>
    }
  } @else {
    @defer (on immediate) {
      <app-project-screen
        (homepageModeRequested)="setHomepageMode($event)"
        (settingsRequested)="openSettings()"
      />
    } @placeholder {
      <p class="homepage-loading" role="status">{{ i18n.t('homepageLoading') }}</p>
    }
  }

  @if (settingsDialogOpen()) {
    <app-settings-dialog (closed)="closeSettings()" />
  }
</div>
