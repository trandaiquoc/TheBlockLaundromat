<div
  #workspaceRoot
  class="diorama-project-workspace"
  [class.board-active]="boardActive()"
  [class.washer-active]="washerActive()"
  [class.paper-active]="paperOpen()"
>
  <app-diorama-project-board-panel
    [active]="boardActive()"
    (backRequested)="backRequested.emit()"
    (projectSelected)="targetRequested.emit('washer')"
    (createRequested)="openPaperFromBoard($event)"
  />

  <app-diorama-washer-panel
    [active]="washerActive()"
    [overlay]="washerOverlay()"
    (backRequested)="backRequested.emit()"
    (boardRequested)="targetRequested.emit('project-board')"
  />

  <app-diorama-project-paper-panel [open]="paperOpen()" (closed)="closePaper()" />
</div>
