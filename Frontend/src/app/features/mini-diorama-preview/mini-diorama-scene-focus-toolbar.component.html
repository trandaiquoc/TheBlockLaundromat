<nav class="mini-diorama__focus-toolbar" [attr.aria-label]="i18n.t('miniDioramaSceneActions')">
  <button
    type="button"
    data-focus-target="overview"
    [class.is-selected]="selectedTarget() === undefined"
    [attr.aria-pressed]="selectedTarget() === undefined"
    [attr.aria-label]="i18n.t('miniDioramaOverview')"
    [attr.title]="i18n.t('miniDioramaOverview')"
    (click)="actionRequested.emit('overview')"
  >
    <svg lucideCompass aria-hidden="true"></svg>
    <span class="mini-diorama__focus-tooltip" aria-hidden="true">
      {{ i18n.t('miniDioramaOverview') }}
    </span>
  </button>
  <button
    type="button"
    data-focus-target="project-board"
    [class.is-selected]="selectedTarget() === 'project-board'"
    [attr.aria-pressed]="selectedTarget() === 'project-board'"
    [attr.aria-label]="i18n.t('miniDioramaProjectBoard')"
    [attr.title]="i18n.t('miniDioramaProjectBoard')"
    (click)="actionRequested.emit('project-board')"
  >
    <svg lucideClipboardList aria-hidden="true"></svg>
    <span class="mini-diorama__focus-tooltip" aria-hidden="true">
      {{ i18n.t('miniDioramaProjectBoard') }}
    </span>
  </button>
  <button
    type="button"
    data-focus-target="washer"
    [class.is-selected]="selectedTarget() === 'washer'"
    [attr.aria-pressed]="selectedTarget() === 'washer'"
    [attr.aria-label]="i18n.t('miniDioramaWasher')"
    [attr.title]="i18n.t('miniDioramaWasher')"
    (click)="actionRequested.emit('washer')"
  >
    <svg lucideWashingMachine aria-hidden="true"></svg>
    <span class="mini-diorama__focus-tooltip" aria-hidden="true">
      {{ i18n.t('miniDioramaWasher') }}
    </span>
  </button>
  <button
    type="button"
    data-focus-target="raccoon"
    [class.is-selected]="selectedTarget() === 'raccoon'"
    [attr.aria-pressed]="selectedTarget() === 'raccoon'"
    [attr.aria-label]="i18n.t('miniDioramaGreetRaccoon')"
    [attr.title]="i18n.t('miniDioramaGreetRaccoon')"
    (click)="actionRequested.emit('raccoon')"
  >
    <svg lucidePawPrint aria-hidden="true"></svg>
    <span class="mini-diorama__focus-tooltip" aria-hidden="true">
      {{ i18n.t('miniDioramaGreetRaccoon') }}
    </span>
  </button>
</nav>
