<main class="mini-diorama">
  <header class="mini-diorama__header">
    <div class="mini-diorama__brand">
      <a class="mini-diorama__back" routerLink="/">{{ i18n.t('miniDioramaBackToProjects') }}</a>
      <p class="mini-diorama__eyebrow">{{ i18n.t('appName') }}</p>
      <h1>{{ i18n.t('miniDioramaTitle') }}</h1>
      <p class="mini-diorama__intro">{{ i18n.t('miniDioramaSubtitle') }}</p>
    </div>
    <div class="mini-diorama__preferences">
      <app-project-screen-controls (settingsRequested)="openSettings()" />
    </div>
  </header>

  <app-mini-diorama-scene-panel />

  @if (settingsDialogOpen()) {
    <app-settings-dialog (closed)="closeSettings()" />
  }
</main>
