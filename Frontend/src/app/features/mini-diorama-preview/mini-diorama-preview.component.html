<main
  class="mini-diorama"
  [attr.data-theme]="themeService.theme()"
  [attr.data-scene-animations-enabled]="sceneAnimationsEnabled()"
  [attr.data-clock-dragging]="clockDragging()"
  [attr.data-sky-orbit]="skyOrbitDirection()"
>
  <div class="mini-diorama__atmosphere" aria-hidden="true">
    <div class="mini-diorama__sky-layer mini-diorama__sky-layer--light"></div>
    <div class="mini-diorama__sky-layer mini-diorama__sky-layer--craft"></div>
    <div class="mini-diorama__sky-layer mini-diorama__sky-layer--raccoon"></div>
    <div class="mini-diorama__sky-layer mini-diorama__sky-layer--dark"></div>
    <div class="mini-diorama__sky-glow" [style.left.%]="skyGlowPercent()"></div>
    <span class="mini-diorama__celestial-orb" [style.left.%]="skyGlowPercent()" (animationend)="completeSkyOrbit($event)">
      <span class="mini-diorama__celestial-orb-disc"></span>
    </span>
    <span class="mini-diorama__sky-cloud mini-diorama__sky-cloud--one"></span>
    <span class="mini-diorama__sky-cloud mini-diorama__sky-cloud--two"></span>
    <span class="mini-diorama__sky-star mini-diorama__sky-star--one"></span>
    <span class="mini-diorama__sky-star mini-diorama__sky-star--two"></span>
    <span class="mini-diorama__sky-star mini-diorama__sky-star--three"></span>
    <span class="mini-diorama__sky-star mini-diorama__sky-star--four"></span>
  </div>

  <app-mini-diorama-scene-panel [sceneKind]="'stage-3-production'" />

  <app-mini-diorama-preview-header />

  <app-mini-diorama-time-dial
    [selectedIndex]="timeStageIndex()"
    [cycleProgress]="cycleProgress()"
    (timeChanged)="handleTimeDialChange($event)"
  />

  <app-mini-diorama-preview-account (settingsRequested)="openSettings()" />

  @if (settingsDialogOpen()) {
    <app-settings-dialog (closed)="closeSettings()" />
  }
</main>
