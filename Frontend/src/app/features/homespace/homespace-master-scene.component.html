@if (scene(); as activeScene) {
  @if (activeScene.environmentalImage; as environment) {
    <div class="homespace-surroundings" aria-hidden="true">
      <div
        class="homespace-surroundings-image"
        [style.background-image]="'url(' + environment.src + ')'"
      ></div>
    </div>
  }
  <div
    #viewport
    class="homespace-viewport"
    [class.is-dragging]="dragging()"
    role="region"
    tabindex="0"
    [attr.aria-label]="i18n.t('homespaceSceneDescription')"
    (keydown)="panWithKeyboard($event)"
  >
    <div
      class="homespace-stage"
      [style.width.px]="layout().stageWidth"
      [style.height.px]="layout().stageHeight"
    >
      <div
        class="homespace-artboard"
        [style.width.px]="activeScene.definition.artboard.width"
        [style.height.px]="activeScene.definition.artboard.height"
        [style.transform]="'scale(' + layout().scale + ')'"
      >
        @for (layer of activeScene.imageLayers; track layer.instance.id) {
          @if (layer.image; as image) {
            <img
              class="scene-layer"
              [class.scene-outside]="layer.asset.role === 'environment'"
              [class.scene-interior]="layer.asset.role === 'room-shell'"
              [class.scene-object]="layer.asset.role === 'object'"
              [ngSrc]="image.src"
              [width]="image.width"
              [height]="image.height"
              [style.left.px]="layer.position.x"
              [style.top.px]="layer.position.y"
              [style.width.px]="layer.asset.bounds.width * layer.scale"
              [style.height.px]="layer.asset.bounds.height * layer.scale"
              [style.zIndex]="layer.depth"
              [style.objectFit]="layer.asset.role === 'room-shell' ? 'contain' : 'fill'"
              alt=""
              priority
              draggable="false"
            />
          }
        }
        <div
          class="scene-layer scene-lighting"
          [style.opacity]="activeScene.definition.lighting.opacity"
          aria-hidden="true"
        ></div>
        <div class="scene-layer scene-object-slot">
          <ng-content select="[homespaceObject]" />
        </div>
        <div class="scene-layer scene-interactive-ui-slot">
          @if (activeScene.projectedSurfaces[0]; as surface) {
            <app-homespace-projective-surface [plane]="surface">
              <ng-content select="[homespaceProjectedUi]" />
            </app-homespace-projective-surface>
          }
        </div>
      </div>
    </div>
  </div>
}
