<section
  class="quick-block-bar"
  [class.collapsed]="quick.collapsed()"
  [attr.aria-label]="i18n.t('quickBlockBar')"
>
  <button
    type="button"
    class="collapse"
    uiTooltip="{{ quick.collapsed() ? i18n.t('expand') : i18n.t('collapse') }}"
    [attr.aria-label]="quick.collapsed() ? i18n.t('expand') : i18n.t('collapse')"
    [attr.aria-expanded]="!quick.collapsed()"
    (click)="quick.toggleCollapsed()"
  >
    @if (quick.collapsed()) {
      <svg lucideChevronUp aria-hidden="true"></svg>
    } @else {
      <svg lucideChevronDown aria-hidden="true"></svg>
    }
  </button>
  @if (!quick.collapsed()) {
    <div class="slots" cdkScrollable>
      @for (entry of entries(); track entry.key; let index = $index) {
        <div class="slot" [class.active]="entry.active">
          <button
            type="button"
            class="slot-select"
            cdkOverlayOrigin
            #nameOrigin="cdkOverlayOrigin"
            [attr.aria-pressed]="entry.active"
            [attr.aria-describedby]="
              materialName()?.entry?.key === entry.key ? 'quick-bar-material-name' : null
            "
            (pointerenter)="showName(entry.key, nameOrigin, $event)"
            (pointerleave)="leaveName(nameOrigin)"
            (focus)="showName(entry.key, nameOrigin)"
            (blur)="hideName()"
            (keydown.escape)="hideName($event)"
            (click)="quick.select(entry); showName(entry.key, nameOrigin)"
            [attr.aria-label]="
              (index === 9 ? 0 : index + 1) + ': ' + entry.displayName + ', ' + entry.id
            "
          >
            <span>
              @if (entry.thumbnail) {
                <img [src]="entry.thumbnail" alt="" />
              } @else {
                <svg class="slot-placeholder" lucideBox aria-hidden="true"></svg>
              }</span
            ><small>{{ index === 9 ? 0 : index + 1 }}</small>
            @if (entry.active) {
              <svg class="slot-selected-indicator" lucideCheck aria-hidden="true"></svg>
            }
          </button>
          <button
            type="button"
            class="slot-remove ui-close-button"
            uiTooltip="{{ i18n.t('removeFromQuickBar') }}"
            (click)="quick.remove(index)"
            [attr.aria-label]="i18n.t('removeFromQuickBar')"
          >
            <svg lucideX aria-hidden="true"></svg>
          </button>
        </div>
      } @empty {
        <small class="empty">{{ i18n.t('addActiveBlockHint') }}</small>
      }
    </div>
  }
</section>
@if (materialName(); as name) {
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="name.origin"
    [cdkConnectedOverlayOpen]="true"
    [cdkConnectedOverlayPositions]="namePositions"
    [cdkConnectedOverlayViewportMargin]="8"
    [cdkConnectedOverlayPush]="true"
    (overlayOutsideClick)="hideName()"
    (overlayKeydown)="handleNameKeydown($event)"
  >
    <div
      class="material-name"
      id="quick-bar-material-name"
      role="tooltip"
      (pointerenter)="cancelNameDismiss()"
      (pointerleave)="scheduleNameDismiss()"
    >
      <strong>{{ name.entry.displayName }}</strong>
      <small>{{ name.entry.itemId }}</small>
    </div>
  </ng-template>
}
