<div class="layer-editor">
  <app-layer-controls
    [currentY]="currentY()"
    [maximumY]="(workspace.project()?.size?.y ?? 1) - 1"
    [busy]="projectionBusy()"
    [updating]="projectionIndicatorVisible()"
    [active]="viewportActive()"
    [visibility]="visibility()"
    [opacity]="
      workspace.project()?.editorSettings?.referenceLayerOpacity ?? defaultReferenceLayerOpacity
    "
    (action)="handleLayerControl($event)"
  />
  <div
    #host
    class="layer-viewport"
    (pointermove)="pointerMove($event)"
    (pointerdown)="pointerDown($event)"
    (pointerup)="pointerUp($event)"
    (pointercancel)="cancelPointer($event)"
    (lostpointercapture)="cancelPointer($event)"
    (pointerleave)="pointerLeave($event)"
    (wheel)="preventViewportWheel($event)"
    (contextmenu)="$event.preventDefault()"
    (window:resize)="resize()"
  >
    <app-viewport-axis-gizmo
      [cameraState]="cameraOrientation()"
      (selectPreset)="chooseAxisView($event)"
    />
    <app-viewport-feedback
      [placementStatus]="placementFeedback()?.status"
      [placementReason]="reasonLabel()"
      [target]="target()"
    />
  </div>
</div>
