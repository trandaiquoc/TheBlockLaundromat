<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">The Block Laundromat four scene palettes</title>
  <desc id="desc">Four warm Minecraft cottagecore palettes for the same tiled laundromat room. Theme differences come from light, window color, and timber finish.</desc>
  <defs>
    <style>
      .title { font: 700 38px 'Segoe UI', sans-serif; fill: #34271d; }
      .subtitle { font: 500 18px 'Segoe UI', sans-serif; fill: #675747; }
      .theme { font: 700 23px 'Segoe UI', sans-serif; fill: #34271d; }
      .role { font: 600 15px 'Segoe UI', sans-serif; fill: #675747; }
      .hex { font: 700 16px 'Consolas', monospace; fill: #34271d; }
      .card { fill: #fbf5e9; stroke: #9b734b; stroke-width: 2; }
      .swatch { stroke: #806044; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#e9dfcf"/>
  <text class="title" x="72" y="84">THE BLOCK LAUNDROMAT · SCENE PALETTE</text>
  <text class="subtitle" x="72" y="120">One 5 × 5 checker-floor room; preserve the Minecraft timber style and shift light, window, and contrast per theme.</text>

  <g transform="translate(72 170)">
    <rect class="card" width="704" height="360" rx="12"/>
    <text class="theme" x="32" y="52">MINECRAFT · sunset</text>
    <text class="role" x="32" y="82">Low orange sun · honey oak · vivid forest green</text>
    <rect class="swatch" x="32" y="112" width="96" height="104" rx="5" fill="#E88C3B"/>
    <rect class="swatch" x="164" y="112" width="96" height="104" rx="5" fill="#8B512C"/>
    <rect class="swatch" x="296" y="112" width="96" height="104" rx="5" fill="#71943B"/>
    <rect class="swatch" x="428" y="112" width="96" height="104" rx="5" fill="#D7B788"/>
    <rect class="swatch" x="560" y="112" width="96" height="104" rx="5" fill="#35251B"/>
    <text class="hex" x="34" y="246">#E88C3B</text>
    <text class="hex" x="166" y="246">#8B512C</text>
    <text class="hex" x="298" y="246">#71943B</text>
    <text class="hex" x="430" y="246">#D7B788</text>
    <text class="hex" x="562" y="246">#35251B</text>
    <text class="role" x="32" y="306">Sunset light</text>
    <text class="role" x="164" y="306">Honey oak</text>
    <text class="role" x="296" y="306">Leaf blocks</text>
    <text class="role" x="428" y="306">Checker tile</text>
    <text class="role" x="560" y="306">Deep shadow</text>
  </g>

  <g transform="translate(824 170)">
    <rect class="card" width="704" height="360" rx="12"/>
    <text class="theme" x="32" y="52">LIGHT · soft morning</text>
    <text class="role" x="32" y="82">Early sunrise · pale oak · fresh garden</text>
    <rect class="swatch" x="32" y="112" width="96" height="104" rx="5" fill="#F7EACD"/>
    <rect class="swatch" x="164" y="112" width="96" height="104" rx="5" fill="#C49D6B"/>
    <rect class="swatch" x="296" y="112" width="96" height="104" rx="5" fill="#93AA69"/>
    <rect class="swatch" x="428" y="112" width="96" height="104" rx="5" fill="#E3D4B8"/>
    <rect class="swatch" x="560" y="112" width="96" height="104" rx="5" fill="#514638"/>
    <text class="hex" x="34" y="246">#F7EACD</text>
    <text class="hex" x="166" y="246">#C49D6B</text>
    <text class="hex" x="298" y="246">#93AA69</text>
    <text class="hex" x="430" y="246">#E3D4B8</text>
    <text class="hex" x="562" y="246">#514638</text>
    <text class="role" x="32" y="306">Dawn light</text>
    <text class="role" x="164" y="306">Pale oak</text>
    <text class="role" x="296" y="306">Fresh leaves</text>
    <text class="role" x="428" y="306">Stone and cream</text>
    <text class="role" x="560" y="306">Warm shadow</text>
  </g>

  <g transform="translate(72 570)">
    <rect class="card" width="704" height="360" rx="12"/>
    <text class="theme" x="32" y="52">RACCOON · 6–7 PM</text>
    <text class="role" x="32" y="82">Early evening twilight · walnut timber · amber lamps</text>
    <rect class="swatch" x="32" y="112" width="96" height="104" rx="5" fill="#B77991"/>
    <rect class="swatch" x="164" y="112" width="96" height="104" rx="5" fill="#78665F"/>
    <rect class="swatch" x="296" y="112" width="96" height="104" rx="5" fill="#737B9D"/>
    <rect class="swatch" x="428" y="112" width="96" height="104" rx="5" fill="#F1B34E"/>
    <rect class="swatch" x="560" y="112" width="96" height="104" rx="5" fill="#29231F"/>
    <text class="hex" x="34" y="246">#B77991</text>
    <text class="hex" x="166" y="246">#78665F</text>
    <text class="hex" x="298" y="246">#737B9D</text>
    <text class="hex" x="430" y="246">#F1B34E</text>
    <text class="hex" x="562" y="246">#29231F</text>
    <text class="role" x="32" y="306">Twilight glow</text>
    <text class="role" x="164" y="306">Taupe timber</text>
    <text class="role" x="296" y="306">Blue-violet sky</text>
    <text class="role" x="428" y="306">Lantern light</text>
    <text class="role" x="560" y="306">Mask charcoal</text>
  </g>

  <g transform="translate(824 570)">
    <rect class="card" width="704" height="360" rx="12"/>
    <text class="theme" x="32" y="52">DARK · late night</text>
    <text class="role" x="32" y="82">Deep blue exterior · cyan window edge · warm lanterns</text>
    <rect class="swatch" x="32" y="112" width="96" height="104" rx="5" fill="#1A2A45"/>
    <rect class="swatch" x="164" y="112" width="96" height="104" rx="5" fill="#293A50"/>
    <rect class="swatch" x="296" y="112" width="96" height="104" rx="5" fill="#55AABD"/>
    <rect class="swatch" x="428" y="112" width="96" height="104" rx="5" fill="#E9A94C"/>
    <rect class="swatch" x="560" y="112" width="96" height="104" rx="5" fill="#B9B4AA"/>
    <text class="hex" x="34" y="246">#1A2A45</text>
    <text class="hex" x="166" y="246">#293A50</text>
    <text class="hex" x="298" y="246">#55AABD</text>
    <text class="hex" x="430" y="246">#E9A94C</text>
    <text class="hex" x="562" y="246">#B9B4AA</text>
    <text class="role" x="32" y="306">Night blue</text>
    <text class="role" x="164" y="306">Blue-oak shade</text>
    <text class="role" x="296" y="306">Window cyan</text>
    <text class="role" x="428" y="306">Lantern light</text>
    <text class="role" x="560" y="306">Raccoon gray</text>
  </g>

  <text class="subtitle" x="72" y="987">Palette swatches are art-direction targets for the 3D scene only; existing application theme CSS is unchanged.</text>
</svg>
